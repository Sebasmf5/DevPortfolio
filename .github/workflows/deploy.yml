name: Deploy Angular to GitHub Pages

on:
  push:
    branches: ['main', 'dev']
  pull_request:
    branches: ['main', 'dev']
  workflow_dispatch:
    inputs:
      deploy_target:
        description: 'Destino (custom_domain usa sebasmf.dev; github_io usa /DevPortfolio/)'
        required: false
        default: 'custom_domain'
        type: choice
        options:
          - custom_domain
          - github_io

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Descargar el código
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Configurar Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # 3. Configurar GitHub Pages
      - name: Setup Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      # 4. Instalar dependencias
      - name: Install dependencies
        run: npm ci

      # 5. Ejecutar linter y pruebas unitarias (headless)
      - name: Run Lint
        run: npm run lint

      - name: Run Unit Tests
        run: npm test

      # 6. Generar build de Angular en producción
      - name: Build Angular
        env:
          DEPLOY_TARGET: ${{ inputs.deploy_target || (vars.USE_GITHUB_IO == 'true' && 'github_io' || 'custom_domain') }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          if [ "$DEPLOY_TARGET" = "github_io" ]; then
            npm run build -- --configuration production --base-href "/${REPO_NAME}/"
            rm -f ./dist/devPortfolio/browser/CNAME
          else
            npm run build -- --configuration production --base-href "/"
          fi

      # 7. Configure SPA fallback (Opcional si no se usa el Hash)
      - name: Configure GitHub Pages fallback
        run: cp ./dist/devPortfolio/browser/index.html ./dist/devPortfolio/browser/404.html

      # 8. Subir artefacto generado
      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist/devPortfolio/browser

  # Despliegue
  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Verificación de disponibilidad post-despliegue (requisito de la guía)
  verify:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: deploy

    steps:
      - name: Verify live site responds HTTP 200
        env:
          TARGET_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          echo "Verificando disponibilidad en: $TARGET_URL"
          for attempt in $(seq 1 12); do
            STATUS=$(curl -L -s -o /dev/null -w "%{http_code}" "$TARGET_URL" || true)
            echo "Intento $attempt/12: HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "Sitio disponible y funcionando correctamente (HTTP 200)."
              exit 0
            fi
            sleep 10
          done
          echo "Error: El sitio $TARGET_URL no respondió HTTP 200."
          exit 1
